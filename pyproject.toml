[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccvalidator"
version = "1.0.0"
description = "Credit card validator: Luhn checksum, brand detection, length, CVV and expiry checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name" }]
keywords = ["credit-card", "validator", "luhn", "payments"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ccvalidator = "ccvalidator.cli:main"

[project.urls]
Homepage = "https://github.com/ThimiraSasmitha/credit-card-validator"
Issues = "https://github.com/ThimiraSasmitha/credit-card-validator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccvalidator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
